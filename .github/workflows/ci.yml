name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # Throwaway Postgres inside the runner: no secrets, nothing shared with
    # the deployed database.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: loans_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/loans_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/loans_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/loans_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations (tables + CHECK constraints)
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Test (unit + integration)
        run: npm test
